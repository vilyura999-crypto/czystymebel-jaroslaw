<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profesjonalne Czyszczenie Chemiczne Mebli i Dywanów</title>
    <style>
        :root { 
            --blue: #1e6fd9; 
            --dark-blue: #1656b0;
            --dark: #1c2b42; 
            --light: #f4f8fe; 
            --white: #ffffff;
            --accent: #25D366;
        }
        
        * { box-sizing: border-box; }
        
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            color: var(--dark); 
            line-height: 1.5;
            background-color: var(--white);
        }

        .dot {
            position: absolute;
            background-color: rgba(30, 111, 217, 0.1);
            border-radius: 50%;
            z-index: 1;
        }
        .dot-hero { width: 120px; height: 120px; top: -40px; right: -40px; }

        .wave-container {
            position: relative;
            background-color: var(--white);
            height: 20px;
            margin-top: -40px;
            z-index: 5;
        }
        
        header { 
            position: relative;
            background: linear-gradient(135deg, var(--light) 0%, #e6effd 100%);
            padding: 60px 20px 80px 20px; 
            overflow: hidden;
        }

        .hero-grid {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
            z-index: 2;
            position: relative;
        }
        
        h1 { 
            font-size: 2.8rem; 
            color: var(--blue);
            font-weight: 800;
            line-height: 1.1;
            margin: 0 0 20px 0;
            text-transform: uppercase;
        }
        
        .subtitle { 
            font-size: 1.3rem; 
            color: var(--blue);
            font-weight: 600;
            margin-bottom: 30px; 
        }

        .promo-badge {
            display: inline-block;
            background-color: var(--blue);
            color: var(--white);
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 25px;
            box-shadow: 0 4px 12px rgba(30, 111, 217, 0.2);
        }
        
        .blue-section {
            background: linear-gradient(135deg, var(--blue) 0%, var(--dark-blue) 100%);
            color: var(--white);
            padding: 60px 20px;
            position: relative;
            text-align: center;
        }

        .blue-section h2 {
            font-size: 2.5rem;
            font-weight: bold;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .blue-section p {
            font-size: 1.2rem;
            max-width: 700px;
            margin: 0 auto 30px auto;
            opacity: 0.95;
        }

        .contact-list {
            list-style: none;
            padding: 0;
            margin: 30px auto;
            max-width: 400px;
            text-align: left;
            font-size: 1.2rem;
        }

        .contact-list li {
            margin-bottom: 15px;
            padding-left: 30px;
            position: relative;
        }

        .contact-list li::before {
            content: "•";
            position: absolute;
            left: 10px;
            color: var(--white);
            font-size: 1.5rem;
            top: -2px;
        }

        .contact-list a {
            color: var(--white);
            text-decoration: underline;
            font-weight: bold;
        }
        
        .btn { 
            display: inline-block; 
            background-color: var(--blue); 
            color: var(--white); 
            padding: 16px 40px; 
            border: none; 
            border-radius: 30px; 
            font-size: 1.1rem; 
            font-weight: bold; 
            cursor: pointer; 
            text-decoration: none; 
            transition: 0.3s; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .btn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .messenger-buttons {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        .btn-msgr {
            padding: 14px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            color: white;
            transition: 0.3s;
            display: inline-block;
            text-align: center;
        }
        
        .btn-whatsapp { background-color: var(--accent); }
        .btn-phone { background-color: var(--dark); }
        .btn-msgr:hover { opacity: 0.9; transform: translateY(-2px); }

        .btn-white {
            background-color: var(--white);
            color: var(--blue);
        }

        .section { padding: 60px 20px; text-align: center; max-width: 1100px; margin: 0 auto; }
        .section-title { font-size: 2.2rem; color: var(--blue); font-weight: bold; margin-bottom: 10px; }
        .section-subtitle { font-size: 1.1rem; color: #666; margin-bottom: 40px; }

        .info-box {
            background-color: var(--light);
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 1.1rem;
            border-left: 5px solid var(--blue);
            text-align: left;
        }

        .car-banner {
            background-color: #fff9db;
            color: #f59f00;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 15px 25px;
            border-radius: 30px;
            margin-top: 20px;
            display: inline-block;
            border: 2px dashed #f59f00;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .service-card {
            background-color: var(--light);
            padding: 25px;
            border-radius: 12px;
            text-align: left;
            border-top: 4px solid var(--blue);
        }

        .service-card h3 {
            color: var(--blue);
            margin-top: 0;
            font-size: 1.4rem;
        }

        .service-card ul {
            padding-left: 20px;
            margin: 0;
        }

        .service-card li {
            margin-bottom: 8px;
        }

        /* Slider Przed / Po */
        .slider-wrapper { max-width: 650px; margin: 0 auto; }
        .before-after-slider { 
            position: relative; 
            width: 100%; 
            height: 0;
            padding-bottom: 66.67%; 
            overflow: hidden; 
            border-radius: 12px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.15); 
        }
        
        .slider-img { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; pointer-events: none; 
        }
        
        .img-after-1 { background-image: url('https://ibb.co'); }
        .img-before-1 { background-image: url('https://ibb.co'); width: 50%; border-right: 3px solid white; z-index: 2; }
        .img-after-2 { background-image: url('https://ibb.co'); }
        .img-before-2 { background-image: url('https://ibb.co'); width: 50%; border-right: 3px solid white; z-index: 2; }
        .img-after-3 { background-image: url('https://ibb.co'); }
        .img-before-3 { background-image: url('https://ibb.co'); width: 50%; border-right: 3px solid white; z-index: 2; }
        .img-after-4 { background-image: url('https://ibb.co'); }
        .img-before-4 { background-image: url('https://ibb.co'); width: 50%; border-right: 3px solid white; z-index: 2; }
        
        .hero-img { background-image: url('https://ibb.co'); width: 100%; max-width: 400px; height: 300px; background-size: contain; background-repeat: no-repeat; background-position: center; margin: 0 auto; }
        .main-logo { background-image: url('https://ibb.co'); width: 100px; height: 100px; background-size: cover; border-radius: 50%; margin: 0 auto 20px auto; border: 3px solid white; }

        .slider-resize { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; z-index: 3; }
        .slider-handle { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 44px; height: 44px; background-color: var(--blue); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); font-weight: bold; pointer-events: none; z-index: 4; }
        
        .steps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .step-card {
            background: white;
            border: 1px solid #eee;
            padding: 20px;
            border-radius: 12px;
            text-align: left;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .step-num {
            font-size: 2rem;
            font-weight: 800;
            color: var(--blue);
            margin-bottom: 10px;
        }

        .step-card h4 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: var(--dark);
        }

        .step-card p {
            margin: 0;
            font-size: 0.95rem;
            color: #666;
        }

        .form-container { max-width: 500px; margin: 40px auto 0 auto; }
